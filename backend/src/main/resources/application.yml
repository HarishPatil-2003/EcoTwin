spring:
  application:
    name: ecotwin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecotwin}
    username: ${DB_USER:ecotwin}
    password: ${DB_PASSWORD:ecotwin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
